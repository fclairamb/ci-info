name: Build

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
  pull_request:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      id-token: write # Codecov upload

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Running golangci-lint
      - name: Linting
        if: matrix.lint
        uses: golangci/golangci-lint-action@v3.7.1
        with:
          version: v1.64.8

      # Install Go
      - name: Setup go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -v ./... -coverprofile=coverage.txt -covermode=atomic

      # No upload token to keep: the job proves who it is to Codecov with its OIDC identity
      - name: Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
  # For github to have a unique status check name
  build-status:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - run: echo 'All good'